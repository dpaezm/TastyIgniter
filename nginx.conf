###############################################################################
# nginx.conf – TastyIgniter + PHP-FPM en contenedor Docker (Coolify-ready)
###############################################################################

user  www-data;
worker_processes  auto;
pid   /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    server_tokens off;
    client_max_body_size 50M;

    ## Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ###########################################################################
    # Default Virtual Host
    ###########################################################################
    server {
        listen       80;
        server_name  _;

        root   /var/www/html/public;
        index  index.php index.html;

        charset utf-8;

        #######################################################################
        # Laravel / TastyIgniter Requests
        #######################################################################
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        #######################################################################
        # Static assets (themes, storage, etc.)
        #######################################################################
        location ~* ^/(themes|storage|app)/.*\.(?:jpg|jpeg|gif|png|css|js|ico|woff2?|ttf|svg|eot)$ {
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        #######################################################################
        # PHP files (FastCGI)
        #######################################################################
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include snippets/fastcgi-php.conf;
        }

        #######################################################################
        # Deny access to hidden files
        #######################################################################
        location ~ /\.(?!well-known).* {
            deny all;
        }

        #######################################################################
        # No logs for common files
        #######################################################################
        location = /favicon.ico  { access_log off; log_not_found off; }
        location = /robots.txt   { access_log off; log_not_found off; }
    }
}

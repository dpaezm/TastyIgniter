###############################################################################
# nginx.conf – TastyIgniter + PHP-FPM dentro del contenedor
###############################################################################

user  www-data;
worker_processes  auto;
pid   /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    ## Tipos MIME por defecto
    include       mime.types;
    default_type  application/octet-stream;

    ## Optimización I/O
    sendfile        on;
    keepalive_timeout  65;

    ###########################################################################
    # Virtual host por defecto
    ###########################################################################
    server {
        listen       80;
        server_name  _;                 # Coolify/Traefik hará el routing por FQDN

        root   /var/www/html/public;    # Document root de Laravel/TastyIgniter
        index  index.php index.html;

        client_max_body_size  50M;
        charset   utf-8;

        ## Compresión Gzip
        gzip  on;
        gzip_types
            text/plain text/css text/javascript
            application/javascript application/json
            application/xml application/xml+rss;

        #######################################################################
        # Rutas principales
        #######################################################################

        # 1) Peticiones “normales” → Laravel/TastyIgniter
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # 2) Assets de los temas (css/js/img) ------------------------------
        location /themes/ {
            alias /var/www/html/themes/;   # <- ojo al “;” final
            access_log off;
            expires 30d;
        }

        # 3) PHP (FastCGI) -------------------------------------------------
        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   127.0.0.1:9000;        # PHP-FPM escucha en 9000
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        }

        # 4) Bloquear archivos ocultos (.env, .git, etc.)
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # 5) Favicon / robots.txt sin log
        location = /favicon.ico       { access_log off; log_not_found off; }
        location = /robots.txt        { access_log off; log_not_found off; }
    }
}
